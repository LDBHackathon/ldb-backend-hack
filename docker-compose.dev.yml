name: ldb-dva-backend-dev
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env-hack
    ports:
      - "8070:8000"
    depends_on:
      - redis
    volumes:
      - /var/log/ldb-dva-api-dev:/app/logs

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data_dev:/data

volumes:
  redis_data_dev:

networks:
  default:
    name: ldb-dva-internal-dev
    external: true
