name: Build and Deploy to DO

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_owner: ${{ steps.owner.outputs.name }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Resolve image owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, tag and push (Development)
        if: github.ref == 'refs/heads/dev'
        run: |
          IMAGE="ghcr.io/${{ steps.owner.outputs.name }}/ldb-dva-be-dev:latest-dev"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Build, tag and push (Production)
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${{ steps.owner.outputs.name }}/ldb-dva-be:latest"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"

  deploy-dev:
    name: Deploy to Development
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file via SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DO_HOST_DEV }}
          username: ${{ secrets.DO_USER_DEV }}
          password: ${{ secrets.DO_PASSWORD_DEV }}
          port: 22
          source: "docker-compose.dev.yml"
          target: "/home/${{ secrets.DO_USER_DEV }}/"

      - name: Deploy to Development (DO)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST_DEV }}
          username: ${{ secrets.DO_USER_DEV }}
          password: ${{ secrets.DO_PASSWORD_DEV }}
          port: 22
          script: |
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker pull ghcr.io/${{ needs.build.outputs.image_owner }}/ldb-dva-be-dev:latest-dev

            sed -i "s|^\([[:space:]]*\)build:.*|\1image: ghcr.io/${{ needs.build.outputs.image_owner }}/ldb-dva-be-dev:latest-dev|" docker-compose.dev.yml

            docker network create ldb-dva-internal-dev || true

            docker compose -f docker-compose.dev.yml down || true
            docker compose -f docker-compose.dev.yml up -d

            docker system prune -f

  deploy-prod:
    name: Deploy to Production
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file via SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DO_HOST_PROD }}
          username: ${{ secrets.DO_USER_PROD }}
          password: ${{ secrets.DO_PASSWORD_PROD }}
          port: 22
          source: "docker-compose.prod.yml"
          target: "/home/${{ secrets.DO_USER_PROD }}/"

      - name: Deploy to Production (DO)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST_PROD }}
          username: ${{ secrets.DO_USER_PROD }}
          password: ${{ secrets.DO_PASSWORD_PROD }}
          port: 22
          script: |
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker pull ghcr.io/${{ needs.build.outputs.image_owner }}/ldb-dva-be:latest

            sed -i "s|^\([[:space:]]*\)build:.*|\1image: ghcr.io/${{ needs.build.outputs.image_owner }}/ldb-dva-be:latest|" docker-compose.prod.yml

            docker network create ldb-dva-internal-prod || true

            docker compose -f docker-compose.prod.yml down || true
            docker compose -f docker-compose.prod.yml up -d

            docker system prune -f
